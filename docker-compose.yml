version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always  # Ensures the web service restarts on failure
    networks:
      - app_network
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - web

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always  # Ensures the database service restarts on failure
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge

healthcheck:
  test: ["CMD", "pg_isready", "-U", "${DATABASE_USER}"]
  interval: 10s
  timeout: 5s
  retries: 5

logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
