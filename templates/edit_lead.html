<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Lead</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>Edit Lead</header>
    <div class="container">
        <form action="{{ url_for('update_lead', lead_id=lead.id) }}" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ lead.name }}" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ lead.email }}" required>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" value="{{ lead.phone }}">
            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="New" {% if lead.status == 'New' %}selected{% endif %}>New</option>
                <option value="Contacted" {% if lead.status == 'Contacted' %}selected{% endif %}>Contacted</option>
                <option value="Closed" {% if lead.status == 'Closed' %}selected{% endif %}>Closed</option>
            </select>
            <button type="submit">Update Lead</button>
        </form>
    </div>
</body>
</html>
